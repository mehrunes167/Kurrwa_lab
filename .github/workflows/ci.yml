name: Python CI (Linter & Tests)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код из репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить линтер (Ruff) и Pytest
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Запустить линтер (проверка стиля)
        run: ruff check .

      - name: Запустить тесты
        run: pytest
